name: Architecture Fitness

on:
  pull_request:
    paths:
      - "fitness/**"
      - "schemas/**"
      - "config/**"
      - "scripts/**"
      - "workspace/proposals/**"
      - "tests/**"
  push:
    branches: [master]
    paths:
      - "fitness/**"
      - "schemas/**"
      - "config/**"
      - "scripts/**"
      - "workspace/proposals/**"
      - "tests/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 scripts/fitness_engine.py validate-definitions
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/harness.py check
      - name: Upload deterministic diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-fitness-diagnostics
          path: |
            workspace/harness/diagnostics.json
            workspace/harness/fitness-results.json
          if-no-files-found: warn
