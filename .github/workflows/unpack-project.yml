name: Unpack initial architecture framework

on:
  push:
    branches:
      - agent/initial-architecture-twin-mvp
    paths:
      - ".github/workflows/unpack-project.yml"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/initial-architecture-twin-mvp
          fetch-depth: 0

      - name: Reconstruct and verify archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/project.b64.part-* | tr -d '\n' | base64 --decode > /tmp/project.zip
          echo "faa1654b258d564f71de5e12aea2c521f6c2cadb5f66068dbe5b18989f8d299b  /tmp/project.zip" | sha256sum --check --strict

      - name: Unpack project sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/project
          unzip -q /tmp/project.zip -d /tmp/project
          rsync -a --exclude='.github/workflows/' /tmp/project/corporate-architecture-twin-mvp/ ./
          rm -rf .bootstrap
          rm -f .repository-seed

      - name: Commit extracted project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add corporate architecture twin MVP"
          git push origin HEAD:refs/heads/agent/initial-architecture-twin-mvp
